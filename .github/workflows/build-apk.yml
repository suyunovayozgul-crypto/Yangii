name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK o'rnatish
        uses: android-actions/setup-android@v3

      - name: Kerakli SDK platformasini o'rnatish (compileSdk 36)
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle o'rnatish va ishga tushirish
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bog'liqliklarni yuklab olish (NextLib tekshiruvi uchun)
        run: gradle :app:dependencies --configuration debugRuntimeClasspath || true

      - name: NextLib kutubxonasi ichini ko'rish (vaqtinchalik)
        run: |
          find ~/.gradle -name "nextlib-media3ext*.jar" -exec unzip -l {} \; | grep -i "class$" | grep -i "renderer"

      - name: Debug APK yasash
        run: gradle assembleDebug --stacktrace

      - name: APK'ni saqlash (Actions natijasida yuklab olish uchun)
        uses: actions/upload-artifact@v4
        with:
          name: SignalIPTV-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
