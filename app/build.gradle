plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.signal.iptv'
    compileSdk 34

    defaultConfig {
        applicationId "com.signal.iptv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Media playback (HLS/M3U8)
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.10.1'
    implementation 'androidx.media3:media3-datasource:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'

    // FFmpeg-based audio decoder for Media3 (AC-3 / E-AC-3 / DTS va h.k.).
    // Ko'p bepul IPTV kanallari shu kodeklarda audio yuboradi va Android'ning
    // standart MediaCodec dekoderi ularni har doim ham qo'llab-quvvatlamaydi —
    // shu kutubxona bo'lmasa video ketadi-yu, ovoz sukut saqlaydi.
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.10.1-0.13.0'

    // Channel logos
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
