plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.signal.iptv'
    compileSdk 36

    defaultConfig {
        applicationId "com.signal.iptv"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // FFmpeg dekoder kutubxonasi (nextlib) arm64-v8a/armeabi-v7a'dan
        // tashqari x86/x86_64 uchun ham fayl qo'shadi. Haqiqiy telefon va
        // Smart TV pristavkalarning deyarli barchasi ARM protsessorli —
        // x86/x86_64 esa faqat kompyuter emulyatorlari uchun kerak. Ularni
        // olib tashlash APK hajmini kamaytiradi va real qurilmaga ta'sir
        // qilmaydi.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Media playback (HLS/M3U8)
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.10.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.10.1'
    implementation 'androidx.media3:media3-datasource:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'

    // OkHttp asosidagi tarmoq qatlami. Android'ning eski, oddiy
    // HttpURLConnection'i (avval ishlatilgan DefaultHttpDataSource) ba'zi
    // IPTV serverlarda (ayniqsa Cloudflare orqasida turganlarda) "bot"likka
    // o'xshab, jimgina rad etiladi — xato ham bermaydi, shunchaki hech narsa
    // yubormaydi. Televizo kabi ko'plab professional pleyerlar aynan OkHttp
    // ishlatadi (HTTP/2, ulanishni qayta ishlatish, zamonaviyroq TLS
    // muzokarasi) — shu serverlarda ko'proq "haqiqiy pleyer"ga o'xshab
    // ko'rinadi va rad etilmaydi.
    implementation 'androidx.media3:media3-datasource-okhttp:1.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // FFmpeg-based audio decoder for Media3 (AC-3 / E-AC-3 / DTS va h.k.).
    // Ko'p bepul IPTV kanallari shu kodeklarda audio yuboradi va Android'ning
    // standart MediaCodec dekoderi ularni har doim ham qo'llab-quvvatlamaydi —
    // shu kutubxona bo'lmasa video ketadi-yu, ovoz sukut saqlaydi.
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.10.1-0.13.0'

    // libmpv (FFmpeg) — ExoPlayer BARCHA qayta urinishlaridan keyin ham
    // ochilmagan kanallar uchun OXIRGI chora zaxira dvigatel. ExoPlayer'ning
    // Java-da yozilgan TS-parseri ba'zi "notekis" MPEG-TS oqimlarda hech
    // qanday xato bermay abadiy buffering holatida qolib ketadi — FFmpeg'ning
    // demuxeri esa xuddi shunday oqimlarga chidamli (VLC/TiviMate shu sabab
    // ochadi). Faqat MpvFallbackPlayer orqali, kamdan-kam holatda ishlatiladi.
    implementation 'dev.jdtech.mpv:libmpv:1.0.0'

    // Channel logos
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
